<!--
  INTERIM LANDING FOR onesocial.oneworldlabs.ai
  =========================================================================
  This repo exists to CLAIM THE HOSTNAME. GitHub Pages matches an incoming host against the CNAME
  file of a repo owned by the account, so without this repo the DNS record resolves but no
  certificate is ever issued and the address simply fails.

  Right now it forwards to where OneSocial actually lives today. That is deliberate and temporary:
  OneSocial's build is compiled with a sub-path base, so its asset URLs would 404 if the same files
  were served from this domain's root.

  TO MAKE THIS THE REAL HOME (do this in OneSocial's own thread):
    1. Rebuild OneSocial with the base path set to "/" instead of its current sub-path.
    2. Replace everything in this repo with that build.
    3. Keep the CNAME file exactly as it is.
    4. Copy index.html to 404.html so client-side routes survive a hard refresh.
  Nothing else changes — DNS and Pages are already correct.

  OneJob has already been through this; frazier56/onejob-app is the worked example.
-->
